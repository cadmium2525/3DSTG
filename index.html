<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05030f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BLOOM DIVE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05030f; overflow: hidden; }
      #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
      #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
