<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Stage 3 danmaku</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #c { display: block; touch-action: none; background: #05030f; }
      #hud { position: fixed; left: 8px; top: 8px; color: #cfe; font: 12px/1.35 monospace; pointer-events: none; white-space: pre; text-shadow: 0 0 3px #000; }
      #out { position: fixed; inset: 0; overflow: auto; color: #cfe; background: #05030fee; font: 13px/1.4 monospace; padding: 12px; white-space: pre; display: none; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="hud"></div>
    <div id="out"></div>
    <script type="module" src="./stage3-demo.ts"></script>
  </body>
</html>
