<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05030f" />
    <title>BLOOM DIVE — UI dev</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05030f; overflow: hidden; }
      #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
      /* Placeholder for the WebGL scene: dark space gradient + letterboxed portrait column + heroine silhouette. */
      #game-canvas {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(90, 60, 180, 0.45), transparent 60%),
          radial-gradient(ellipse at 30% 80%, rgba(255, 111, 181, 0.18), transparent 55%),
          linear-gradient(180deg, #0b0628, #05030f 70%);
      }
      #stage-col { position: absolute; top: 0; bottom: 0; left: 50%; width: min(100vw, 56vh); transform: translateX(-50%);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05); }
      #heroine { position: absolute; left: 50%; top: 50%; width: 34%; height: 30%; transform: translate(-50%, -50%);
        border-radius: 45% 45% 40% 40%; background: radial-gradient(ellipse at 50% 30%, rgba(255,240,200,.55), rgba(240,244,255,.35) 45%, rgba(47,95,208,.25) 70%, transparent 72%); }
      #ui-root { position: absolute; inset: 0; }
      #dev { position: fixed; z-index: 100; right: 6px; bottom: 6px; max-width: 300px; display: flex; flex-wrap: wrap; gap: 4px;
        font: 11px system-ui, sans-serif; background: rgba(0,0,0,.65); padding: 6px; border-radius: 6px; color: #ccc; }
      #dev button { font: inherit; padding: 4px 6px; }
      #dev.hidden { display: none; }
      #log { width: 100%; white-space: pre-wrap; max-height: 80px; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-canvas"><div id="stage-col"><div id="heroine"></div></div></div>
      <div id="ui-root"></div>
    </div>
    <div id="dev"></div>
    <script type="module" src="./ui-demo.ts"></script>
  </body>
</html>
